<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama | Kulaktan</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/kulaktan.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { max-width: 440px; width: 100%; margin: 2rem; }
        .card img { margin-bottom: 1.25rem; }
        #msg { margin-top: 1.25rem; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div class="card panel panel-pad">
        <img src="/assets/logo-icon.png" alt="Kulaktan" style="height:44px; width:44px; object-fit:contain;">
        <h1 style="font-size:1.7rem; margin-bottom:0.75rem;">Yeni Şifre Belirle</h1>
        <p>E-postanıza gelen bağlantı üzerinden buradasınız. Yeni şifrenizi girin.</p>

        <form id="resetForm" class="mt-4">
            <div class="field">
                <label>Yeni Şifre</label>
                <input type="password" id="newPassword" placeholder="En az 8 karakter" required minlength="8">
            </div>
            <div class="field">
                <label>Yeni Şifre (Tekrar)</label>
                <input type="password" id="newPassword2" placeholder="Şifrenizi tekrar girin" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Şifreyi Güncelle</button>
        </form>
        <div id="msg"></div>
        <p class="mt-4" style="font-size:0.88rem;">
            <a href="/admin.html" class="text-link">Kurumsal Giriş</a> ·
            <a href="/uzman.html" class="text-link">Uzman Girişi</a> ·
            <a href="/board.html" class="text-link">YK Girişi</a>
        </p>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const msgBox = document.getElementById('msg');

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            msgBox.textContent = 'Geçersiz bağlantı: token eksik. Lütfen e-postanızdaki bağlantıyı tam olarak kullanın.';
            msgBox.style.color = '#8c2b30';
            msgBox.style.display = 'block';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('newPassword2').value;
            if (p1 !== p2) {
                msgBox.textContent = 'Şifreler eşleşmiyor.';
                msgBox.style.color = '#8c2b30';
                msgBox.style.display = 'block';
                return;
            }
            try {
                const resp = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: p1 })
                });
                const data = await resp.json();
                if (!resp.ok || !data.success) throw new Error(data.error || 'Bir hata oluştu.');
                msgBox.textContent = data.message;
                msgBox.style.color = '#2f5c3e';
                msgBox.style.display = 'block';
                document.getElementById('resetForm').style.display = 'none';
            } catch (err) {
                msgBox.textContent = err.message;
                msgBox.style.color = '#8c2b30';
                msgBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
